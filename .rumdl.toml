# rumdl — fast Rust Markdown linter/formatter (PyPI: rumdl).
# Run via `pixi run tools run md` (check) or `rumdl fmt .` to fix.

[global]
flavor = "gfm"
line-length = 100
respect-gitignore = true
cache = true
cache-dir = ".rumdl_cache"
exclude = [
  ".agents/skills/**",
  ".pixi/**",
  "node_modules/**",
  "coverage/**",
  # PR/issue templates intentionally start at H2 (GitHub renders them in a form)
  ".github/**",
]
disable = [
  # Prose paragraphs and wide tables often exceed 100 chars;
  # keep structural rules strict, let MD013 stay off globally.
  "MD013",
]

[MD004]
style = "dash"

[MD049]
style = "asterisk"

[MD025]
# MyST pages may carry both a YAML title and a single body H1; count body headings only.
front-matter-title = ""

[MD050]
style = "asterisk"

# rumdl auto-detects MDX by extension; pin the parser explicitly for docs.
[per-file-flavor]
"**/*.mdx" = "mdx"

# MyST renders the status icons at a fixed size. The Markdown image syntax
# (`![alt](src){width=18px}`) is an attribute extension MyST accepts but GitHub
# and rumdl do not, and it leaked the literal `{width=18px}` into the published
# `llms-full.txt`. The pages use plain `<img>` now, which every renderer honours,
# so MD033 is allowed for these icon tags only — the rule stays on everywhere else.
[per-file-ignores]
"docs/**/*.md" = ["MD033"]

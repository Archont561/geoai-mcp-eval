[project]
name = "experiment"
version = "0.1.0"
description = "Thesis experiment CLI: MCP typed tools vs PyQGIS code generation for LLM agents in GIS"
requires-python = ">=3.12,<3.14"
dependencies = [
    "typer",
    "pyyaml",
]

[project.scripts]
experiment = "experiment.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [{include = "experiment", from = "src"}]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-v"

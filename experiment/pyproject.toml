[project]
name = "experiment"
version = "0.1.0"
description = "Thesis experiment CLI: MCP typed tools vs PyQGIS code generation for LLM agents in GIS"
requires-python = ">=3.12,<3.14"
dependencies = [
    "typer",
    "pyyaml>=6,<7",
    "jsonschema>=4.26,<5",
    "pydantic>=2.5,<3",
    "rich>=15,<16",
    "shapely>=2,<3",
]

[project.scripts]
experiment = "experiment.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [{include = "experiment", from = "src"}]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-v"

[tool.tasknest.tasks.preflight]
cmd = ["python", "run_cli.py", "workflow", "preflight"]
description = "Validate the pilot task suite and pin the run environment."
marks = ["ci", "workflow"]

[tool.tasknest.tasks.model]
cmd = ["python", "run_cli.py", "workflow", "model"]
description = "Start Ollama, pull the pinned model, and record its digest."
marks = ["ci", "workflow", "setup"]

[tool.tasknest.tasks.run]
cmd = ["python", "run_cli.py", "workflow", "run"]
description = "Run one experiment cell (arm, task, repetition)."
marks = ["ci", "workflow"]

[tool.tasknest.tasks.harvest]
cmd = ["python", "run_cli.py", "workflow", "harvest"]
description = "Merge cell outputs, re-run the oracle gate, and assert completeness."
marks = ["ci", "workflow"]

[tool.tasknest.tasks.summary]
cmd = ["python", "run_cli.py", "workflow", "summary"]
description = "Write the experiment step summary (artifacts, pins, completeness)."
marks = ["ci", "workflow"]

[tool.tasknest.tasks.backend-check]
cmd = ["python", "run_cli.py", "workflow", "backend-check"]
description = "Verify remote-ollama SSH tunnel, poll /v1/models digest, and run one tiny completion."
marks = ["workflow"]

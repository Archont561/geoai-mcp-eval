schema_version: 1
id: prep-axis-order-001
title: Write Poland's representative point in RFC 7946 order
prompt: >-
  The input is a Natural Earth country polygon in longitude/latitude coordinates.
  Select the feature whose ISO_A3 property is POL. Write exactly one GeoJSON
  FeatureCollection to result.geojson containing that feature's Shapely-style
  representative point and preserving its ADMIN and ISO_A3 properties. RFC 7946
  coordinates are [longitude, latitude]; do not swap the axes. Do not use an
  online geocoder or fetch any additional data.
family: P
difficulty_rubric:
  tier: 2
  n_tools_human: 2
  n_steps_human: 3
  expressible: medium
provenance:
  source: Natural Earth Vector 1:110m Admin 0 Countries
  source_url: https://github.com/nvkelso/natural-earth-vector
  source_file: geojson/ne_110m_admin_0_countries.geojson
  source_commit: ca96624a56bd078437bca8184e78163e5039ad19
  license: Public domain (Natural Earth README)
  contamination: constructed
fixtures:
  input: fixtures/prepare/poland.geojson
human_baseline:
  status: pending
  artifact_dir: baselines/prep-axis-order-001
  produced_with: null
  human_time_min: null
  human_steps: null
  human_tools: []
oracle:
  determinism_runs: 3
  assertions:
    - id: single-output-feature
      type: geojson_feature_count
      output: result.geojson
      expected: 1
    - id: representative-point-axis-order
      type: representative_point_matches
      fixture: fixtures/prepare/poland.geojson
      output: result.geojson
      id_field: ISO_A3
      feature_id: POL
      preserve_fields:
        - ADMIN
        - ISO_A3
      tolerance_degrees: 0.000001
budget_bounds:
  max_tool_calls: 20
  max_wall_s: 300
runs: 2
required_traps:
  - crs-axis-order

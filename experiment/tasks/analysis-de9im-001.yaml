schema_version: 1
id: analysis-de9im-001
title: Verify the Poland–Czechia boundary relation
prompt: >-
  Using the two country polygons in the supplied GeoJSON, determine the
  topological relation of Poland (ISO_A3 POL) to Czechia (ISO_A3 CZE). Write a
  JSON object to result.json with exactly the keys `relation` and `de9im`.
  Report the Shapely/DE-9IM relation string and the relation name `touches` when
  the polygons meet only along their shared boundary. Do not use external data.

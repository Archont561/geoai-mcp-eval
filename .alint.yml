# alint — declarative repository layout & policy rules (PyPI: alint==0.22.1).
#
# Run with `pixi run tools run alint`.
# Extended from the Archont561 template set; rules that require a git checkout or
# product code we do not have yet are intentionally not included.

version: 1

extends:
  # Open-source hygiene. Codes-of-conduct / CODEOWNERS / security policy are not
  # required for a single-maintainer research repo; drop these exceptions when publishing.
  - url: alint://bundled/oss-baseline@v1
    except:
      - oss-security-policy-exists
      - oss-codeowners-exists
      - oss-code-of-conduct-exists
  - alint://bundled/hygiene/no-tracked-artifacts@v1
  - alint://bundled/hygiene/lockfiles@v1
  - alint://bundled/agent-hygiene@v1
  - alint://bundled/agent-context@v1
  - alint://bundled/tooling/editorconfig@v1
  - alint://bundled/ci/github-actions@v1

rules:
  - id: require-root-readme
    kind: file_exists
    paths: README.md
    level: error
    message: "Repository root README.md is required."

  - id: require-agent-instructions
    kind: file_exists
    paths: AGENTS.md
    level: error
    message: "AGENTS.md with standing contributor/agent conventions is required."

  - id: require-pixi-manifest
    kind: file_exists
    paths: pixi.toml
    level: error
    message: "pixi.toml is the only allowed environment manifest; keep it at the root."

  - id: require-tasknest-manifest
    kind: file_exists
    paths: tasknest.toml
    level: error
    message: "tasknest.toml declares the single `tools` automation entrypoint."

  - id: require-tools-entrypoint
    kind: toml_path_equals
    paths: pixi.toml
    path: "$.tasks.tools"
    equals: "tasknest"
    level: error
    message: "pixi.toml must define exactly the `tools` task pointing at the Python-native tasknest runner."

  - id: require-experiment-package
    kind: file_exists
    paths: experiment/__init__.py
    level: error
    message: "experiment/ is the Python source root for the study; do not move it."

  - id: require-smoke-tests
    kind: file_exists
    paths: experiment/tests/test_smoke.py
    level: error
    message: "A smoke test must live under experiment/tests/ so `experiment/` remains the Python source root."

  - id: require-experiment-features
    kind: file_exists
    paths: experiment/features/README.md
    level: error
    message: "Experiment feature specifications belong under experiment/features/."

  - id: require-myst-prototype
    kind: file_exists
    paths: docs/myst.yml
    level: error
    message: "The one-page MyST documentation prototype must be configured in docs/myst.yml."

  - id: require-pages-workflow
    kind: file_exists
    paths: .github/workflows/pages.yml
    level: error
    message: "GitHub Pages CI must build the MyST prototype from docs/myst.yml."

  - id: pages-runs-myst-build
    kind: file_content_matches
    paths: .github/workflows/pages.yml
    pattern: "(?m)^        run: npm exec --yes --package=mystmd@1\\.13\\.0 -- myst build --html --strict --ci$"
    level: error
    message: "The Pages workflow must build the pinned MyST CLI in strict CI mode."

  - id: pages-uses-docs-config
    kind: file_content_matches
    paths: .github/workflows/pages.yml
    pattern: "(?m)^        working-directory: docs$"
    level: error
    message: "The Pages workflow must run MyST from docs/ to load docs/myst.yml."

  - id: forbid-pyproject-as-env-manifest
    kind: file_absent
    paths: uv.lock
    level: error
    message: "pixi is the environment manager; do not introduce uv/pip-tools lockfiles."

  - id: require-ci-workflow
    kind: file_exists
    paths: .github/workflows/ci.yml
    level: error
    message: "CI must run the alint/ruff/pytest gates on every push and PR."

  - id: require-codecov-config
    kind: file_exists
    paths: codecov.yml
    level: error
    message: "Codecov coverage status and thresholds must be configured in codecov.yml."

  - id: gitignore-has-pixi
    kind: file_content_matches
    paths: .gitignore
    pattern: "(?m)^\\.pixi/$"
    level: error
    message: ".gitignore must exclude .pixi/ (solve-group environments)."

  - id: readme-identifies-template-source
    kind: file_content_matches
    paths: README.md
    pattern: "(?m)^<!-- Generated from templates/README\\.md\\.j2; do not edit directly\\. -->$"
    level: error
    message: "README.md must identify templates/README.md.j2 as its generated source."

  - id: agents-identifies-template-source
    kind: file_content_matches
    paths: AGENTS.md
    pattern: "(?m)^<!-- Generated from templates/AGENTS\\.md\\.j2; do not edit directly\\. -->$"
    level: error
    message: "AGENTS.md must identify templates/AGENTS.md.j2 as its generated source."

  - id: bug-form-identifies-template-source
    kind: file_content_matches
    paths: .github/ISSUE_TEMPLATE/bug_report.yml
    pattern: "(?m)^# Generated from templates/github/ISSUE_TEMPLATE/bug_report\\.yml\\.j2; do not edit directly\\.$"
    level: error
    message: "The bug report form must identify its Jinja2 template source."

  - id: issue-config-identifies-template-source
    kind: file_content_matches
    paths: .github/ISSUE_TEMPLATE/config.yml
    pattern: "(?m)^# Generated from templates/github/ISSUE_TEMPLATE/config\\.yml\\.j2; do not edit directly\\.$"
    level: error
    message: "The issue form configuration must identify its Jinja2 template source."

  - id: feature-form-identifies-template-source
    kind: file_content_matches
    paths: .github/ISSUE_TEMPLATE/feature_request.yml
    pattern: "(?m)^# Generated from templates/github/ISSUE_TEMPLATE/feature_request\\.yml\\.j2; do not edit directly\\.$"
    level: error
    message: "The feature request form must identify its Jinja2 template source."

  - id: pull-request-template-identifies-template-source
    kind: file_content_matches
    paths: .github/PULL_REQUEST_TEMPLATE.md
    pattern: "(?m)^<!-- Generated from templates/github/PULL_REQUEST_TEMPLATE\\.md\\.j2; do not edit directly\\. -->$"
    level: error
    message: "The pull request template must identify its Jinja2 source."

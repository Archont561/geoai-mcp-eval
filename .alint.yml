# alint — declarative repository layout & policy rules (PyPI: alint==0.22.1).
#
# Run with `pixi run tools run alint`.
# Extended from the Archont561 template set; rules that require a git checkout or
# product code we do not have yet are intentionally not included.

version: 1

extends:
  # Open-source hygiene. Codes-of-conduct / CODEOWNERS / security policy are not
  # required for a single-maintainer research repo; drop these exceptions when publishing.
  - url: alint://bundled/oss-baseline@v1
    except:
      - oss-security-policy-exists
      - oss-codeowners-exists
      - oss-code-of-conduct-exists
  - alint://bundled/hygiene/no-tracked-artifacts@v1
  - alint://bundled/hygiene/lockfiles@v1
  - alint://bundled/agent-hygiene@v1
  - alint://bundled/agent-context@v1
  - alint://bundled/tooling/editorconfig@v1
  - alint://bundled/ci/github-actions@v1

rules:
  - id: require-root-readme
    kind: file_exists
    paths: README.md
    level: error
    message: "Repository root README.md is required."

  - id: require-agent-instructions
    kind: file_exists
    paths: AGENTS.md
    level: error
    message: "AGENTS.md with standing contributor/agent conventions is required."

  - id: require-pixi-manifest
    kind: file_exists
    paths: pixi.toml
    level: error
    message: "pixi.toml is the only allowed environment manifest; keep it at the root."

  - id: require-tasknest-manifest
    kind: file_exists
    paths: tasknest.toml
    level: error
    message: "tasknest.toml declares the single `tools` automation entrypoint."

  - id: require-tools-entrypoint
    kind: toml_path_equals
    paths: pixi.toml
    path: "$.tasks.tools"
    equals: "tasknest"
    level: error
    message: "pixi.toml must define the `tools` task pointing at the Python-native Tasknest runner."

  - id: require-experiment-entrypoint
    kind: toml_path_equals
    paths: pixi.toml
    path: "$.tasks.experiment.cmd"
    equals: "python -m experiment"
    level: error
    message: "pixi.toml must expose the experiment CLI through the documented `experiment` task."

  - id: forbid-experiment-package-at-repo-root
    kind: file_absent
    paths: experiment/__init__.py
    level: error
    message: "The experiment package lives in experiment/src/experiment/, not at the repository root."

  - id: require-experiment-package
    kind: file_exists
    paths: experiment/src/experiment/__init__.py
    level: error
    message: "experiment/ must have a src/experiment/ package (__init__.py)."

  - id: require-smoke-tests
    kind: file_exists
    paths: experiment/tests/test_smoke.py
    level: error
    message: "A smoke test must live under experiment/tests/ so `experiment/` remains the Python source root."

  - id: require-experiment-features
    kind: file_exists
    paths: experiment/features/README.md
    level: error
    message: "Experiment feature specifications belong under experiment/features/."

  # --- experiment* project structure enforcement (src / tests / features) ---

  - id: require-experiment-src-package
    kind: file_exists
    paths: experiment/src/experiment/__init__.py
    level: error
    message: "experiment/ must have a src/experiment/ package (__init__.py)."

  - id: require-experiment-qgis-plugin-package
    kind: file_exists
    paths: experiment-qgis-plugin/experiment_plugin/__init__.py
    level: error
    message: "experiment-qgis-plugin/ must have an experiment_plugin/ package at the project root (__init__.py) — the layout qgis-sdk expects."

  - id: require-experiment-qgis-plugin-tests
    kind: file_exists
    paths: experiment-qgis-plugin/tests/test_plugin.py
    level: error
    message: "experiment-qgis-plugin/ must have tests/ with test_plugin.py."

  - id: require-experiment-qgis-plugin-features
    kind: file_exists
    paths: experiment-qgis-plugin/features/hello.feature
    level: error
    message: "experiment-qgis-plugin/ must have features/ with hello.feature."

  - id: require-myst-prototype
    kind: file_exists
    paths: docs/myst.yml
    level: error
    message: "The pre-experiment MyST documentation must be configured in docs/myst.yml."

  - id: require-pages-workflow
    kind: file_exists
    paths: .github/workflows/pages.yml
    level: error
    message: "GitHub Pages CI must build the documentation from docs/myst.yml."

  - id: pages-runs-myst-build
    kind: file_content_matches
    paths: .github/workflows/pages.yml
    pattern: "(?m)^        run: pixi run --environment docs -- npm exec --yes --package=mystmd@1\\.13\\.0 -- myst build --html --strict --ci$"
    level: error
    message: "The Pages workflow must build the pinned MyST CLI in strict CI mode."

  - id: pages-uses-docs-config
    kind: file_content_matches
    paths: .github/workflows/pages.yml
    pattern: "(?m)^        working-directory: docs$"
    level: error
    message: "The Pages workflow must run MyST from docs/ to load docs/myst.yml."

  - id: forbid-pyproject-as-env-manifest
    kind: file_absent
    paths: uv.lock
    level: error
    message: "pixi is the environment manager; do not introduce uv/pip-tools lockfiles."

  - id: require-ci-workflow
    kind: file_exists
    paths: .github/workflows/ci.yml
    level: error
    message: "CI must run the alint/ruff/pytest gates on every push and PR."

  - id: ci-validates-pilot-task-suite
    kind: file_content_matches
    paths: .github/workflows/ci.yml
    pattern: "(?m)^        run: pixi run experiment pilot validate$"
    level: error
    message: "CI must validate the pilot task suite through the experiment CLI."

  - id: lint-runs-rude
    kind: file_content_matches
    paths: tools/lint.py
    pattern: "(?s)python.*-m.*rude.*check"
    level: error
    message: "The Python lint gate must run rude before Ruff."

  - id: require-codecov-config
    kind: file_exists
    paths: codecov.yml
    level: error
    message: "Codecov coverage status and thresholds must be configured in codecov.yml."

  - id: require-bun-tool-manifest
    kind: file_exists
    paths: package.json
    level: error
    message: "package.json pins the project-local skills and Backlog.md CLIs."

  - id: require-bun-tool-lockfile
    kind: file_exists
    paths: bun.lock
    level: error
    message: "bun.lock must pin the package versions used to install skills and Backlog.md."

  - id: require-skills-lock
    kind: file_exists
    paths: skills-lock.json
    level: error
    message: "skills-lock.json records the upstream source and content hashes for installed skills."

  - id: require-project-skill
    kind: file_exists
    paths: .agents/skills/bdd-scenarios/SKILL.md
    level: error
    message: "At least one downloaded project skill must be installed under .agents/skills/."

  - id: require-backlog-readme
    kind: file_exists
    paths: backlog/README.md
    level: error
    message: "The initialized Backlog.md workspace must document its local layout and CLI."

  - id: require-backlog-config
    kind: file_exists
    paths: backlog/config.yml
    level: error
    message: "Backlog.md configuration must be committed in backlog/config.yml."

  - id: gitignore-has-pixi
    kind: file_content_matches
    paths: .gitignore
    pattern: "(?m)^\\.pixi/$"
    level: error
    message: ".gitignore must exclude .pixi/ (solve-group environments)."

  - id: readme-identifies-template-source
    kind: file_content_matches
    paths: README.md
    pattern: "(?m)^<!-- Generated from templates/README\\.md\\.j2; do not edit directly\\. -->$"
    level: error
    message: "README.md must identify templates/README.md.j2 as its generated source."

  - id: agents-identifies-template-source
    kind: file_content_matches
    paths: AGENTS.md
    pattern: "(?m)^<!-- Generated from templates/AGENTS\\.md\\.j2; do not edit directly\\. -->$"
    level: error
    message: "AGENTS.md must identify templates/AGENTS.md.j2 as its generated source."

  - id: bug-form-identifies-template-source
    kind: file_content_matches
    paths: .github/ISSUE_TEMPLATE/bug_report.yml
    pattern: "(?m)^# Generated from templates/github/ISSUE_TEMPLATE/bug_report\\.yml\\.j2; do not edit directly\\.$"
    level: error
    message: "The bug report form must identify its Jinja2 template source."

  - id: issue-config-identifies-template-source
    kind: file_content_matches
    paths: .github/ISSUE_TEMPLATE/config.yml
    pattern: "(?m)^# Generated from templates/github/ISSUE_TEMPLATE/config\\.yml\\.j2; do not edit directly\\.$"
    level: error
    message: "The issue form configuration must identify its Jinja2 template source."

  - id: feature-form-identifies-template-source
    kind: file_content_matches
    paths: .github/ISSUE_TEMPLATE/feature_request.yml
    pattern: "(?m)^# Generated from templates/github/ISSUE_TEMPLATE/feature_request\\.yml\\.j2; do not edit directly\\.$"
    level: error
    message: "The feature request form must identify its Jinja2 template source."

  - id: pull-request-template-identifies-template-source
    kind: file_content_matches
    paths: .github/PULL_REQUEST_TEMPLATE.md
    pattern: "(?m)^<!-- Generated from templates/github/PULL_REQUEST_TEMPLATE\\.md\\.j2; do not edit directly\\. -->$"
    level: error
    message: "The pull request template must identify its Jinja2 source."

  - id: llms-text-identifies-source
    kind: file_content_matches
    paths: docs/llms.txt
    pattern: "(?m)^<!-- Generated from docs/myst\\.yml; do not edit directly\\. -->$"
    level: error
    message: "docs/llms.txt must identify its MyST source."

  - id: llms-full-identifies-source
    kind: file_content_matches
    paths: docs/llms-full.txt
    pattern: "(?m)^<!-- Generated from docs/myst\\.yml; do not edit directly\\. -->$"
    level: error
    message: "docs/llms-full.txt must identify its MyST source."

  - id: sitemap-identifies-source
    kind: file_content_matches
    paths: docs/sitemap.xml
    pattern: "(?m)^<!-- Generated from docs/myst\\.yml; do not edit directly\\. -->$"
    level: error
    message: "docs/sitemap.xml must identify its MyST source."

  - id: robots-identifies-source
    kind: file_content_matches
    paths: docs/robots.txt
    pattern: "(?m)^# Generated from docs/myst\\.yml; do not edit directly\\.$"
    level: error
    message: "docs/robots.txt must identify its MyST source."

  - id: analysis-chart-identifies-source
    kind: file_content_matches
    paths: docs/assets/gis-se-demand.svg
    pattern: "(?m)^<!-- Generated from docs/analyses/gis-se-analysis\\.md; do not edit directly\\. -->$"
    level: error
    message: "The GIS.SE chart must identify its notebook source."

  # The pixi-sandbox publisher (`publish-sandbox.yml`) is generated by `pixi-sandbox init`
  # and pushes sandbox branches, so it legitimately needs `contents: write`; editing it by
  # hand would be reverted by `pixi-sandbox upgrade`. Scope the bundled least-privilege rule
  # to the hand-written workflows so it keeps guarding ci.yml and pages.yml.
  - id: gha-workflow-contents-read
    kind: yaml_path_absent
    paths: ".github/workflows/ci.yml, .github/workflows/pages.yml"
    path: "$[?((!$.permissions && count($.jobs[*].permissions)==0) || $.permissions=='write-all' || $.permissions.contents=='write')]"
    level: warning
    message: "Workflow grants (or defaults to) write access to the GITHUB_TOKEN. Restrict it: declare `permissions: contents: read` (or `read-all`, or `{}`) at the workflow level, or set per-job `permissions:`, so a compromised step can't push to the repo."
    policy_url: https://docs.github.com/en/actions/security-guides/automatic-token-authentication#permissions-for-the-github_token

StylesPath = .vale/styles
MinAlertLevel = warning
Vocab = Product
# Two prose genres live in this repository, and they answer to different guides.
#
# Project-facing Markdown (README, AGENTS, contribution and reference pages) is
# developer documentation: the Microsoft and Google guides apply, with proselint and
# write-good adding readability checks on top.
#
# The research chapters under docs/study, docs/review, docs/analyses, and
# docs/findings are scientific prose. The Microsoft and Google guides forbid spaced em
# dashes, contractions, and the passive voice — conventions that scholarly writing here
# relies on — so those chapters are held to the scientific set (proselint + write-good)
# plus the project vocabulary instead of being rewritten to house style. See
# docs/provenance.md for the chapter set and its provenance.
Packages = Microsoft, Google, proselint, write-good

[*.md]
BasedOnStyles = Vale, Microsoft, Google
Vale.Spelling = NO
# "agent" is the object of study, not a Microsoft product term; the guide's
# preferred substitute ("personal digital assistant") would misdescribe the arms.
Microsoft.Terms = NO

[*.mdx]
BasedOnStyles = Vale, Microsoft, Google
Vale.Spelling = NO
Microsoft.Terms = NO

# --- scientific prose: proselint + write-good, plus the shared vocabulary ---
[docs/study/*.md]
BasedOnStyles = Vale, proselint, write-good
Vale.Spelling = NO

[docs/review/*.md]
BasedOnStyles = Vale, proselint, write-good
Vale.Spelling = NO

[docs/analyses/*.md]
BasedOnStyles = Vale, proselint, write-good
Vale.Spelling = NO

[docs/findings/*.md]
BasedOnStyles = Vale, proselint, write-good
Vale.Spelling = NO

[docs/*.md]
BasedOnStyles = Vale, proselint, write-good
Vale.Spelling = NO

# Arm labels are bolded letters in parentheses, "(A)" through "(H)". proselint reads
# "(C)" as a misspelt copyright mark, so the typography rule is off for the two pages
# that list the arms.
[docs/study/{aim,context}.md]
BasedOnStyles = Vale, proselint, write-good
Vale.Spelling = NO
proselint.Typography = NO


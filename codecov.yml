codecov:
  require_ci_to_pass: true

coverage:
  precision: 2
  round: down
  range: "90...100"
  status:
    project:
      default: false
      experiment:
        flags:
          - experiment
        target: 90%
        threshold: 0%
    patch:
      default:
        target: 90%
        threshold: 0%

flags:
  experiment:
    paths:
      - experiment/
    carryforward: true

ignore:
  - "experiment/tests/**"
  - "experiment/features/**"

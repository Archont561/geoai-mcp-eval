# pixi workspace — https://pixi.sh
#
# geoai-mcp-eval: thesis experiment code (MCP typed tools vs PyQGIS code
# generation for LLM agents in GIS).
#
# `tools` is the sole repository-automation task and runs Tasknest. `experiment`
# is the study application CLI; application commands such as task-suite validation
# run through `pixi run experiment ...`, not through separate Tasknest tools.

[workspace]
name = "geoai-mcp-eval"
version = "0.1.0"
description = "Thesis experiment: MCP typed tools vs PyQGIS code generation for LLM agents in GIS"
license = "MIT"
channels = ["conda-forge", "https://prefix.dev/archont561/archont561"]
platforms = ["linux-64", "osx-arm64", "win-64"]

[tasks]
tools = "tasknest"
experiment = { cmd = "python -m experiment", env = { PYTHONPATH = "experiment/src" } }

[feature.python.dependencies]
python = ">=3.12,<3.14"
ruff = "*"
pytest = "*"
pytest-cov = "*"
hypothesis = "*"

[feature.python.pypi-dependencies]
rude = "*"
rude-clean-code = "*"
typer = "*"
# The feature files under experiment/features and experiment-qgis-plugin/features
# are executable specifications: pytest-bdd binds each scenario to a pytest test.
# Version 9 is the first line that supports pytest 9, which this workspace pins.
pytest-bdd = ">=9,<10"

# THE EXPERIMENT RUNTIME — QGIS plugin development stack.
# qgis-sdk provides declarative plugin authoring (native dialogs, typed actions,
# Processing algorithm contracts) without requiring QGIS at import time.
# qgis (conda-forge, linux-64) provides the QGIS Desktop host for `qgis-sdk dev` and `qgis-sdk test --target desktop`.
[feature.experiment.dependencies]
python = ">=3.12,<3.14"
pyyaml = ">=6,<7"

[feature.experiment.pypi-dependencies]
jsonschema = ">=4.26,<5"
pydantic = ">=2.11.2,<3"
pydantic-settings = ">=2.10,<3"
rich = ">=15,<16"
# Transport SDKs used inside `experiment.adapters` behind Clean Architecture ports:
# - `sshtunnel` manages programmatic SSH port-forwarding behind `TunnelProbe`
# - `ollama` (PyPI client SDK, distinct from the linux-64 conda-forge server binary)
# - `openrouter` (official SDK for OpenRouter profiles such as `free-open`)
sshtunnel = ">=0.5,<0.6"
ollama = ">=0.6,<0.7"
openrouter = ">=1.3,<2"
# Generic OpenAI-compatible HTTP endpoints still fall back to `requests` + `urllib3`.
requests = ">=2.32,<3"
urllib3 = ">=2,<3"
# `analyze.py` imports pandas directly. It reaches the default environment only
# through geopandas, which is a linux-64 target dependency; declare it so the
# analysis path resolves on every platform the workspace claims.
pandas = ">=2,<4"
qgis-sdk = "*"
# The qgis-sdk meta-package's Linux wheel is a 0.0.0 placeholder; install the
# actual runtime explicitly so imports such as `from qgis_sdk import describe` work.
qgis-sdk-runtime = "==0.11.0"

[feature.experiment.target.linux-64.dependencies]
qgis = "4.2.*"
ollama = "0.32.*"
mcp = "*"
geopandas = "*"
shapely = "*"
pyproj = "*"
rasterio = "*"
pyogrio = "*"

[feature.lint.dependencies]
actionlint = "*"
lychee = "*"
# conda-forge ships the real `vale` binary; the PyPI `vale` is only a stub.
vale = "=3.27.0"

[feature.lint.target.unix.dependencies]
lefthook = "*"
shellcheck = "*"

[feature.lint.pypi-dependencies]
alint = "==0.22.1"
# Enforces the layer boundaries declared in pyproject.toml's [tool.importlinter]
# section. alint checks repository layout, not import graphs, so the architecture
# contract needs its own checker; `pixi run tools run architecture` runs it.
import-linter = "==2.17"
rumdl = "==0.3.4"

# gherlint moved to its own environment (gherlint-env) because it requires
# pydantic<2.0.0 which conflicts with the default environment's pydantic==2.x.
# Use `pixi install --environment gherlint-env` to use it.
[feature.gherlint.dependencies]
pydantic = "<2.0.0"

[feature.gherlint.pypi-dependencies]
gherlint = "*"

# Docs build environment: the MyST site and reactive analyses in docs/ use
# jupyter-book-marimo (registered in docs/myst.yml). Keep this stack in its own
# solve group so analysis dependencies do not perturb the default environment.
[feature.docs.dependencies]
python = ">=3.12,<3.14"

[feature.docs.pypi-dependencies]
jupyter-book-marimo = "*"
marimo = "*"
pandas = "*"
altair = "*"
stackapi = "*"
diskcache = "*"
great_tables = "*"

[feature.automation.pypi-dependencies]
tasknest = "==0.4.0"

# pixi-sandbox installed from https://prefix.dev/archont561/archont561
# (channel reachability not independently verified here). Provides isolated sandbox environments
# for running QGIS sessions with the experiment plugin.
[feature.sandbox.dependencies]
pixi-sandbox = ">=0.9.0,<0.10"

[environments]
default = { features = ["python", "experiment", "lint", "automation"], solve-group = "default" }
docs = { features = ["docs"], solve-group = "docs" }
sandbox = { features = ["python", "experiment", "sandbox", "automation"], solve-group = "default" }
# gherlint requires pydantic<2.0.0, incompatible with default's pydantic==2.x.
# Keep it isolated so `pixi install` (default) works; use
# `pixi install --environment gherlint-env` when gherlint is needed.
gherlint-env = { features = ["gherlint"], solve-group = "gherlint" }

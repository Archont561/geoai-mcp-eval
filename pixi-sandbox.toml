# pixi-sandbox configuration — https://github.com/Archont561/pixi-sandbox
#
# INERT for now. `pixi-sandbox` is NOT on conda-forge; the template pins it from
# the channel https://prefix.dev/archont561/archont561, which answered 404 from
# this workspace, so no `sandbox` environment exists in pixi.toml yet.
#
# This file declares what a self-describing, offline, ~95 MiB-blob clone pack
# of this repo should contain (used once pixi-sandbox is re-added together with
# a reachable channel — see the commented [feature.sandbox] note in pixi.toml).
# It is cargo_vendor = false (pure-Python repo; no Cargo registry to vendor).

schema = 1
branch_prefix = "sandbox"
cargo_vendor = false

[budgets]
max_blob_mib = 95
max_transport_mib = 2048
max_repository_push_mib = 2048
max_restore_required_mib = 8192

[[bundle]]
name = "developer"
environments = ["default"]
platforms = ["linux-64"]

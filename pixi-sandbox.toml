# pixi-sandbox configuration — https://github.com/Archont561/pixi-sandbox
#
# Pixi-sandbox bundle settings. The sandbox environment is declared in pixi.toml and
# resolves through the same published channels (conda-forge plus the external
# prefix.dev/archont561/archont561 channel that provides `pixi-sandbox` itself).
#
# `.github/workflows/publish-sandbox.yml` packs the four environments below into
# `sandbox/developer-linux-64` on every push to main; `./restore.sh` unpacks that branch
# on an offline host. That publisher is the one workflow that requires
# `contents: write` — `.alint.yml` scopes the least-privilege rule to the hand-written
# workflows so this machine-generated file is never hand-edited to satisfy it.
#
# This file describes a self-describing, offline clone pack of the repository.
# It is cargo_vendor = false (no Cargo registry is used by the repo).
#
# Bundled environments mirror pixi.toml [environments]:
#   default   — python + experiment + lint + automation (tools, tasknest, rude)
#   docs      — docs build (jupyter-book-marimo, marimo, pandas, altair, …)
#   sandbox   — python + experiment + sandbox + automation (qgis, ollama, qgis-sdk)
#   gherlint-env — isolated: gherlint + pydantic<2.0.0 (conflicts with default)

schema = 1
branch_prefix = "sandbox"
cargo_vendor = false

[budgets]
max_blob_mib = 95
max_transport_mib = 8192
max_repository_push_mib = 8192
max_restore_required_mib = 32768

[[bundle]]
name = "developer"
environments = ["default", "docs", "sandbox", "gherlint-env"]
platforms = ["linux-64"]

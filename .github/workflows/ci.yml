name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo:
    name: Repo Policies (alint, Markdown, Vale, Actions)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Pixi workspace
        uses: ./.github/actions/setup
        with:
          environment: default

      - name: Lint workflow files (actionlint)
        run: pixi run tools run actions

      - name: Run repository policies (alint)
        run: pixi run tools run alint

      - name: Lint Markdown and MDX (rumdl)
        run: pixi run tools run md

      - name: Lint technical and scientific prose (Vale)
        run: pixi run tools run prose

  python:
    name: Python Lint & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Pixi workspace
        uses: ./.github/actions/setup
        with:
          environment: default

      - name: Ruff check & format check
        run: pixi run tools run lint

      - name: Run pytest with 90% coverage floor
        run: pixi run tools run test

      - name: Upload experiment coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.xml
          flags: experiment
          use_oidc: true
          fail_ci_if_error: false

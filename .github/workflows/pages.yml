name: Documentation Pages

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build documentation site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Pixi workspace
        uses: ./.github/actions/setup
        with:
          environment: default

      - name: Lint Markdown and MDX (rumdl)
        run: pixi run tools run md

      - name: Lint technical and scientific prose (Vale)
        run: pixi run tools run prose

      - name: Setup Node.js for MyST
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      - name: Install the locked documentation environment
        run: pixi install --locked --environment docs

      - name: Build the documentation site
        run: pixi run --environment docs -- npm exec --yes --package=mystmd@1.13.0 -- myst build --html --strict --ci
        working-directory: docs
        env:
          BASE_URL: /${{ github.event.repository.name }}/

      - name: Verify generated sitemap and robots.txt
        working-directory: docs
        run: |
          ! grep -E "pre\.render|localhost" _build/html/sitemap.xml _build/html/robots.txt
          test -s _build/html/llms.txt && test -s _build/html/llms-full.txt
          grep -q "/${{ github.event.repository.name }}/" _build/html/sitemap.xml

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: docs/_build/html

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

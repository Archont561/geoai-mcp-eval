# Config for code tooling only — the repo is NOT a packaged distribution.
# Runtime/experiment dependencies live in pixi.toml ([feature.*]), never here.

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "W",   # pycodestyle warnings
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "SIM", # flake8-simplify
  "C4",  # flake8-comprehensions
]

[tool.ruff.lint.isort]
known-first-party = ["experiment", "experiment_plugin"]

# Architecture contracts — enforced by `pixi run tools run architecture`
# (import-linter), wired into `pixi run tools check` through the `architecture`
# tool's dependency.
#
# These describe the *target* boundaries. While the refactor is in flight the
# contracts that do not yet hold are marked non-breaking; flip `contracts` to
# emptiness as each layer lands. A contract that never fails is worthless, so
# `test_architecture_contracts_bite` pins that the shipped graph is exercised.
[tool.importlinter]
root_package = "experiment"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain is pure: no I/O, no framework, no experiment layer above it"
type = "forbidden"
source_modules = ["experiment.domain"]
forbidden_modules = [
  "typer", "rich", "requests", "yaml", "jsonschema", "mcp", "subprocess",
  "pathlib", "tomllib", "os",
  "experiment.adapters", "experiment.cli", "experiment.oracle", "experiment.gis_ops",
]

[[tool.importlinter.contracts]]
name = "Adapters are the only layer that reads or writes files"
type = "forbidden"
source_modules = ["experiment.adapters"]
forbidden_modules = [
  "experiment.cli", "experiment.oracle",
]

[[tool.importlinter.contracts]]
name = "The arm A catalogue never imports the oracle"
type = "forbidden"
source_modules = ["experiment.gis_ops"]
forbidden_modules = ["experiment.oracle"]

[tool.pytest.ini_options]
pythonpath = ["experiment/src", "experiment-qgis-plugin"]
testpaths = ["experiment/tests", "experiment-qgis-plugin/tests"]
addopts = "-q"
# Gherkin tags used by the feature files, declared so pytest-bdd's scenario
# markers are known rather than reported as typos.
markers = [
  "cli: scenarios driving the whole Typer application",
  "plugin: scenarios driving the whole QGIS plugin",
  "action-surface: the plugin's public action surface",
  "human-baseline: session recording and the reference record",
  "session-panel: the timer and logs panel",
  "host-observation: QGIS project and canvas hooks",
  "pilot: the pilot task suite and the determinism gate",
  "analysis: analysis-ready data preparation",
  "proto: prototype runs, scoring, and the MCP self-test",
  "workflow: the end-to-end pass from suite check to predicate matrix",
  "qgis: the PyQGIS sandbox availability check and script runner",
]

[tool.coverage.run]
source = ["experiment/src/experiment"]
branch = true
omit = ["experiment/tests/*"]

[tool.coverage.report]
show_missing = true

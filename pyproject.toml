# Config for code tooling only — the repo is NOT a packaged distribution.
# Runtime/experiment dependencies live in pixi.toml ([feature.*]), never here.

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "W",   # pycodestyle warnings
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "SIM", # flake8-simplify
  "C4",  # flake8-comprehensions
]

[tool.ruff.lint.isort]
known-first-party = ["experiment", "experiment_plugin"]

# Architecture contracts — enforced by `pixi run tools run architecture`
# (import-linter), wired into `pixi run tools check` through the `architecture`
# tool's dependency.
#
# All runtime modules live strictly inside cli / services / adapters / domain
# (plus the isolated gis_ops catalogue, oracle engine, and notebook-first
# analysis package). The architecture tests run the shipped configuration
# against both the repository and deliberately broken copies of its import graph.
[tool.importlinter]
root_packages = ["experiment", "experiment_plugin"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain is pure: no I/O, no framework, no experiment layer above it"
type = "forbidden"
source_modules = ["experiment.domain"]
forbidden_modules = [
  "typer", "rich", "requests", "yaml", "jsonschema", "mcp", "subprocess",
  "pathlib", "tomllib", "os", "zipfile", "pydantic_settings",
  "diskcache", "tenacity", "jenkspy", "mapclassify", "filelock", "tabulate", "github", "pandera",
  "sshtunnel", "paramiko", "ollama", "openrouter", "httpx",
  "experiment.adapters", "experiment.cli", "experiment.oracle", "experiment.gis_ops",
]

[[tool.importlinter.contracts]]
name = "Adapters are the only layer that reads or writes files"
type = "forbidden"
source_modules = ["experiment.adapters"]
forbidden_modules = [
  "experiment.cli", "experiment.oracle",
]

[[tool.importlinter.contracts]]
name = "The arm A catalogue never imports the oracle"
type = "forbidden"
source_modules = ["experiment.gis_ops"]
forbidden_modules = ["experiment.oracle"]

[[tool.importlinter.contracts]]
name = "CLI, services, adapters and domain follow dependency direction"
type = "layers"
layers = [
  "experiment.cli",
  "experiment.services",
  "experiment.adapters",
  "experiment.domain",
]

[[tool.importlinter.contracts]]
name = "Services have no CLI or presentation framework dependencies"
type = "forbidden"
source_modules = ["experiment.services"]
forbidden_modules = ["typer", "rich"]

[[tool.importlinter.contracts]]
name = "Services delegate transport, subprocess, and storage I/O to adapters"
type = "forbidden"
source_modules = ["experiment.services"]
forbidden_modules = [
  "requests", "urllib", "subprocess", "sqlite3", "tomllib", "mcp", "zipfile",
  "os", "qgis", "osgeo", "sshtunnel", "paramiko", "ollama", "openrouter", "httpx",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "CLI never performs transport or subprocess I/O directly"
type = "forbidden"
source_modules = ["experiment.cli"]
forbidden_modules = [
  "requests", "urllib", "subprocess", "sqlite3", "tomllib", "mcp", "zipfile",
  "sshtunnel", "paramiko", "ollama", "openrouter", "httpx",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "CLI calls services rather than importing adapters directly"
type = "forbidden"
source_modules = ["experiment.cli"]
forbidden_modules = ["experiment.adapters", "experiment.gis_ops"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Analysis never imports or reads the LLM completion cache"
type = "forbidden"
source_modules = ["experiment.analysis"]
forbidden_modules = ["experiment.adapters.llm_cache", "experiment.domain.cache_key"]

[[tool.importlinter.contracts]]
name = "Analysis never shells out via subprocess or gh CLI"
type = "forbidden"
source_modules = ["experiment.analysis"]
forbidden_modules = ["experiment.adapters.subprocess_runner", "subprocess"]

[[tool.importlinter.contracts]]
name = "QGIS plugin core has no QGIS, Qt, or qgis_sdk imports"
type = "forbidden"
source_modules = [
  "experiment_plugin.metrics",
  "experiment_plugin.review",
  "experiment_plugin.session",
  "experiment_plugin._io",
  "experiment_plugin._processing_log",
  "experiment_plugin._review_cli",
  "experiment_plugin._review_merge",
  "experiment_plugin._session_io",
  "experiment_plugin._state",
  "experiment_plugin._tasks",
]
forbidden_modules = ["qgis", "PyQt5", "PyQt6", "qgis_sdk"]

[tool.pytest.ini_options]
pythonpath = [
  "experiment/src",
  "experiment-qgis-plugin",
  "experiment/tests",
  "experiment-qgis-plugin/tests",
]
testpaths = ["experiment/tests", "experiment-qgis-plugin/tests"]
addopts = "-q --import-mode=importlib"
# Gherkin tags used by the feature files, declared so pytest-bdd's scenario
# markers are known rather than reported as typos.
markers = [
  "cli: scenarios driving the whole Typer application",
  "plugin: scenarios driving the whole QGIS plugin",
  "action-surface: the plugin's public action surface",
  "human-baseline: session recording and the reference record",
  "post-session-review: non-destructive post-session review of recorded takes",
  "session-panel: the timer and logs panel",
  "host-observation: QGIS project and canvas hooks",
  "pilot: the pilot task suite and the determinism gate",
  "analysis: analysis-ready data preparation and GitHub run loading",
  "proto: prototype runs, scoring, and the MCP self-test",
  "workflow: the end-to-end pass from suite check to archive bundle",
  "qgis: the PyQGIS sandbox availability check and script runner",
  "qgis_sandbox: isolated GIS script execution gate",
  "tasks: task suite discovery and schema validation",
  "oracle: automated spatial and cartographic grading",
  "runs: paradigm execution, token accounting, and response caching",
  "archive: run archive packing, merging, tamper checks, and inspection",
  "preflight: remote backend verification, tunnels, and diagnostics",
  "review: non-destructive human-baseline session review",
  "smoke: fast end-to-end sanity checks",
  "edge_case: negative paths, error diagnostics, and boundary conditions",
]

[tool.coverage.run]
source = ["experiment/src/experiment"]
branch = true
omit = ["experiment/tests/**", "experiment-qgis-plugin/tests/**"]

[tool.coverage.report]
show_missing = true
